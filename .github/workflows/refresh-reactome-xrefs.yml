name: Refresh xrefs from Reactome

on:
  workflow_dispatch:
  schedule:
  - cron: '17 4 * * 0'

jobs:
  update:

    runs-on: ubuntu-latest
    container: obolibrary/odkfull:${{ vars.ODK_VERSION }}

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      
    - name: Work around https://github.com/peter-evans/create-pull-request/issues/1170
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      
    - name: Download latest xrefs from Reactome and refresh import
      working-directory: src/ontology
      # Regenerate the import only when Reactome's file changed: every rebuild
      # gives the import a new dated versionIRI, which would open a PR each week.
      run: |
        rm ../resources/Pathways2GoTerms_human.txt
        make ../resources/Pathways2GoTerms_human.txt
        if git diff --quiet -- ../resources/Pathways2GoTerms_human.txt; then
          echo "Pathways2GoTerms_human.txt unchanged; import not regenerated."
        else
          make imports/reactome_xrefs_import.owl
        fi
    
    - name: Create PR
      uses: peter-evans/create-pull-request@v7
      with:
        title: Update Reactome xrefs
        branch: refresh-reactome-xrefs
        add-paths: |
          src/resources/Pathways2GoTerms_human.txt
          src/ontology/imports/reactome_xrefs_import.owl
        token: ${{ secrets.PR_ACTION_TOKEN }}
