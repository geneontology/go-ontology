pattern_name: intramembrane lipid carrier activity

pattern_iri: http://purl.obolibrary.org/obo/go/patterns/intramembrane_lipid_carrier_activity.yaml

description: >
  Intramembrane lipid carriers move a specific lipid between the two
  leaflets of the same membrane. Three families share this shape and are
  distinguished by parent (direction and energy source):
    - flippase activity (GO:0140327): exoplasmic to cytosolic, ATP-driven
    - floppase activity (GO:0140328): cytosolic to exoplasmic, ATP-driven
    - scramblase activity (GO:0017128): bidirectional, ATP-independent
  This pattern is written against the shared grandparent
  GO:0140303 intramembrane lipid carrier activity; children should
  additionally be asserted is_a on the appropriate direction-specific
  parent above. For flippase/floppase-family children (ATP-driven),
  assert relationship: has_part GO:0016887 ATP hydrolysis activity.
  Do NOT use this pattern for intermembrane lipid transfer (use
  intermembrane_lipid_transfer_activity.yaml) or for generic lipid
  delivery to an acceptor molecule (use molecular_carrier_activity.yaml).

classes:
  intramembrane lipid carrier activity: 'GO:0140303'
  lipid: 'CHEBI:18059'

relations:
  has primary input: 'RO:0004009'

vars:
  lipid_cargo: "'lipid'"

name:
  text: "%s intramembrane carrier activity"
  vars:
    - lipid_cargo

def:
  text: "Catalysis of the movement of %s from one leaflet of a membrane bilayer to the other."
  vars:
    - lipid_cargo

namespace:
  text: 'molecular_function'

equivalentTo:
  text: "'intramembrane lipid carrier activity' and ('has primary input' some %s)"
  vars:
    - lipid_cargo
