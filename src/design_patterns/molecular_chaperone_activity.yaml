pattern_name: molecular chaperone activity

pattern_iri: http://purl.obolibrary.org/obo/go/patterns/molecular_chaperone_activity.yaml

description: >
  A refinement of molecular_carrier_activity.yaml for carriers whose
  acceptor is stipulated to be a protein. Curators use the label
  '%s chaperone activity' rather than '%s carrier activity' in this case
  (metal chaperones, histone chaperones, etc). The equivalence axiom is
  the same as for the generic carrier pattern; the chaperone vs carrier
  distinction is editorial (label + text definition), not logical.
  Do not conflate with GO:0044183 protein folding chaperone activity, which
  is a distinct sense of "chaperone" (folding assistance rather than cargo
  delivery). Exception: GO:0140597 keeps the label 'protein carrier
  activity' rather than 'protein chaperone activity' to avoid that
  collision when the cargo itself is a protein.

classes:
  molecular carrier activity: 'GO:0140104'
  chemical entity: 'CHEBI:24431'
  protein: 'PR:000000001'

relations:
  has primary input: 'RO:0004009'

vars:
  cargo: "'chemical entity' or 'protein'"

name:
  text: "%s chaperone activity"
  vars:
    - cargo

def:
  text: "Binding to and delivering %s to a target protein."
  vars:
    - cargo

namespace:
  text: 'molecular_function'

equivalentTo:
  text: "'molecular carrier activity' and ('has primary input' some %s)"
  vars:
    - cargo
