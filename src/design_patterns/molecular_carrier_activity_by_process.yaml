pattern_name: molecular carrier activity by transport process

pattern_iri: http://purl.obolibrary.org/obo/go/patterns/molecular_carrier_activity_by_process.yaml

description: >
  Molecular carrier activities differentiated by the transport process
  they are part of, rather than by cargo. Use this pattern only when the
  cargo cannot be pinned to a single well-defined class (for example, a
  carrier that moves either proteins or RNAs), but the transport
  biological process is defined. When the cargo IS a single well-defined
  class, use molecular_carrier_activity.yaml instead. Prototype:
  GO:0140142 nucleocytoplasmic carrier activity (part_of
  GO:0006913 nucleocytoplasmic transport).

  Note on the label template: '%s carrier activity' is a naming
  convention rather than a mechanical substitution. Filling the sole
  current instance mechanically gives 'nucleocytoplasmic transport
  carrier activity', where the curated label is
  'nucleocytoplasmic carrier activity' - the trailing 'transport' from
  the process label is dropped. This is analogous to
  chemical_transport.yaml (where CHEBI labels are similarly not always
  substituted verbatim into the term name).

classes:
  molecular carrier activity: 'GO:0140104'
  transport: 'GO:0006810'

relations:
  part of: 'BFO:0000050'

vars:
  transport_process: "'transport'"

name:
  text: "%s carrier activity"
  vars:
    - transport_process

def:
  text: "A molecular carrier activity that binds and carries a cargo as part of %s by moving along with the cargo."
  vars:
    - transport_process

namespace:
  text: 'molecular_function'

equivalentTo:
  text: "'molecular carrier activity' and ('part of' some %s)"
  vars:
    - transport_process
