pattern_name: intermembrane lipid transfer activity

pattern_iri: http://purl.obolibrary.org/obo/go/patterns/intermembrane_lipid_transfer_activity.yaml

description: >
  Lipid transfer activities differentiated by the specific lipid cargo.
  The lipid is moved from a donor membrane or lipid particle to an
  acceptor membrane or lipid particle while shielded from the aqueous
  phase. The pattern is mechanism-neutral: it covers both shuttle
  (GO:7770133) and bridge (GO:7770132) mechanisms, so cargo-specific
  terms do not specify the mechanism. Inherits is_a transporter activity
  (GO:0005215) via the parent GO:0120013, but not lipid carrier activity
  (GO:0005319), which applies only to the shuttle mechanism.
  Do NOT use this pattern for cross-leaflet (intramembrane) lipid
  movement - use intramembrane_lipid_carrier_activity.yaml for that.

classes:
  lipid transfer activity: 'GO:0120013'
  lipid: 'CHEBI:18059'

relations:
  has primary input: 'RO:0004009'

vars:
  lipid_cargo: "'lipid'"

name:
  text: "%s transfer activity"
  vars:
    - lipid_cargo

def:
  text: "Enables the transfer of a %s from a donor membrane or lipid particle to an acceptor membrane or lipid particle, with the lipid shielded from the aqueous phase during transfer."
  vars:
    - lipid_cargo

namespace:
  text: 'molecular_function'

equivalentTo:
  text: "'lipid transfer activity' and ('has primary input' some %s)"
  vars:
    - lipid_cargo
